<section class="section skills-section" id="skills">
  <div class="section-inner">
    <span class="section-label">Skills</span>
    <h2 class="section-title">Expertise map</h2>
    <div class="skills-grid">
      @for (skill of items(); track skill.name) {
        <div class="skill-item card">
          <div class="skill-header">
            <span class="skill-name">{{ skill.name }}</span>
            <span class="skill-cat">{{ skill.category }}</span>
          </div>
          <div class="skill-bar" role="progressbar" [attr.aria-valuenow]="skill.level" aria-valuemin="0" aria-valuemax="100">
            <div class="skill-fill" [style.width.%]="animated() ? skill.level : 0"></div>
          </div>
          <span class="skill-pct">{{ skill.level }}%</span>
        </div>
      }
    </div>
  </div>
</section>
